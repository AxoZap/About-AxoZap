<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8"><!-- brvgs-fix-css -->
<style>
/* --- Fix: dropdown submenus don't need Google's broken offline JS anymore --- */
li[data-nav-level="1"] > .oGuwee {
  display: none !important;
}
li[data-nav-level="1"]:hover > .oGuwee,
li[data-nav-level="1"]:focus-within > .oGuwee {
  display: block !important;
}

/* --- Fix: embedded YouTube videos collapsing to 0 height offline --- */
iframe[src*="youtube.com"] {
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
  width: 100% !important;
  height: 500px !important;
  min-height: 400px !important;
  border: 0 !important;
}
.YMEQtf, .WIdY2d.M1aSXe {
  min-height: 400px !important;
}
</style>
<meta name="referrer" content="strict-origin-when-cross-origin">
</head><body></body></html>
